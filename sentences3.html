<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Речення за словами 3</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff8ec;
    --card: #ffffff;
    --text: #2d2a32;
    --muted: #7a7380;
    --accent: #ff8a3d;
    --accent-dark: #e86f1f;
    --chip: #fff1e2;
    --chip-border: #ffd2ad;
    --ok: #2fae66;
    --ok-bg: #e4f7ec;
    --line: #eadfce;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d1b22; --card: #2a2731; --text: #f3eef7; --muted: #b0a8b8;
      --accent: #ff9a52; --accent-dark: #ffb27a; --chip: #3a3141; --chip-border: #5a4a5c;
      --ok: #5fd892; --ok-bg: #213a2c; --line: #3d3845;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1d1b22; --card: #2a2731; --text: #f3eef7; --muted: #b0a8b8;
    --accent: #ff9a52; --accent-dark: #ffb27a; --chip: #3a3141; --chip-border: #5a4a5c;
    --ok: #5fd892; --ok-bg: #213a2c; --line: #3d3845;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Nunito", system-ui, sans-serif; font-size: 18px;
    min-height: 100vh; display: flex; justify-content: center; padding: 24px 16px;
  }
  .wrap { width: 100%; max-width: 640px; }
  h1 { font-size: 26px; margin: 0 0 4px; text-align: center; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 18px; }
  .progress { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 8px; }
  .bar { height: 100%; background: var(--accent); width: 10%; transition: width .3s; }
  .count { text-align: center; color: var(--muted); font-weight: 700; margin-bottom: 16px; }
  .card { background: var(--card); border-radius: 22px; padding: 24px; box-shadow: 0 6px 24px rgba(0,0,0,.07); }
  .words { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 20px; }
  .chip {
    background: var(--chip); border: 2px solid var(--chip-border); border-radius: 16px;
    padding: 10px 16px; font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 8px;
    transition: all .2s;
  }
  .chip.used { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
  label { display: block; font-weight: 700; margin-bottom: 8px; }
  textarea {
    width: 100%; min-height: 90px; font: inherit; font-size: 20px; color: var(--text);
    background: var(--bg); border: 2px solid var(--line); border-radius: 14px; padding: 12px; resize: vertical;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .feedback { min-height: 28px; margin-top: 10px; font-weight: 700; }
  .feedback.ok { color: var(--ok); }
  .feedback.warn { color: var(--accent-dark); }
  button {
    font: inherit; font-weight: 800; border: none; border-radius: 14px; cursor: pointer;
    padding: 12px 18px; transition: transform .1s, opacity .2s;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .35; cursor: default; }
  .btn-light { background: var(--chip); color: var(--text); border: 2px solid var(--chip-border); font-size: 16px; padding: 8px 14px; }
  .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; }
  .nav button { flex: 1; font-size: 20px; }
  .btn-back { background: var(--card); color: var(--text); border: 2px solid var(--line); }
  .btn-next { background: var(--accent); color: #fff; }
  .final { text-align: center; }
  .final ol { text-align: left; line-height: 1.6; padding-left: 24px; }
  .final .empty { color: var(--muted); font-style: italic; }
  .big { font-size: 56px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Склади речення ✏️</h1>
  <p class="sub">Використай усі слова. Слова можна змінювати: <b>свічка → свічку</b>.</p>

  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="count" id="count"></div>

  <div class="card" id="task">
    <div class="words" id="words"></div>
    <label for="answer">Твоє речення:</label>
    <textarea id="answer" placeholder="Напиши речення тут…"></textarea>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="card final" id="final" style="display:none">
    <div class="big">🎉</div>
    <h2>Молодець!</h2>
    <p>Ось твої речення:</p>
    <ol id="list"></ol>
    <button class="btn-light" id="restartBtn">🔄 Почати знову</button>
  </div>

  <div class="nav">
    <button class="btn-back" id="backBtn">← Назад</button>
    <button class="btn-next" id="nextBtn">Далі →</button>
  </div>
</div>

<script>
const tasks = [
  { words: [["мама",["мам"]],["торт",["торт"]],["свічка",["свічк","свічц","свіч"]]] },
  { words: [["півник",["півник","півн","півен"]],["паркан",["паркан"]],["ранок",["ранок","ранк","ранц","вранці"]]] },
  { words: [["хлопчик",["хлопч","хлопц"]],["змій",["змій","змія","змію","змієм","змії","змі"]],["вітер",["вітер","вітр"]]] },
  { words: [["кішка",["кішк","кішц","кіш","кішеч"]],["клубок",["клубок","клубк","клубоч"]],["крісло",["крісл","крісел"]]] },
  { words: [["ведмідь",["ведмід","ведмед"]],["мед",["мед","медок","медк"]],["барліг",["барліг","барлог","барлоз","барлож"]]] },
  { words: [["дівчинка",["дівч"]],["сукня",["сукн","сукон","суконь"]],["шафа",["шаф"]]] },
  { words: [["їжачок",["їжач","їжак"]],["гриб",["гриб"]],["стежка",["стежк","стежц","стежин","стежок"]]] },
  { words: [["тато",["тат"]],["риба",["риб"]],["річка",["річк","річц","річ","рік"]]] },
  { words: [["корова",["коров","корів"]],["трава",["трав","травичк","травичц"]],["луг",["луг","лузі"]]] },
  { words: [["діти",["діт","дітл"]],["ялинка",["ялинк","ялинц","ялин"]],["іграшка",["іграшк","іграшц","іграш"]]] }
];

const KEY = "sentences-answers-v3";
let answers = new Array(tasks.length).fill("");
try { const s = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(s) && s.length === tasks.length) answers = s; } catch (e) {}
let i = 0;

const $ = id => document.getElementById(id);
const norm = t => t.toLowerCase().replace(/[’ʼ`']/g, "'");

function save() { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} }

function usedWords(text) {
  const tokens = norm(text).split(/[^а-яіїєґ'a-z]+/i).filter(Boolean);
  return tasks[i].words.map(([, stems]) =>
    tokens.some(tok => stems.some(st => tok.startsWith(norm(st)) || tok.includes(norm(st)))));
}

function renderChips() {
  const used = usedWords($("answer").value);
  $("words").innerHTML = tasks[i].words.map(([w], k) =>
    `<div class="chip${used[k] ? " used" : ""}">${w}</div>`).join("");
}

function render() {
  const done = i >= tasks.length;
  $("task").style.display = done ? "none" : "block";
  $("final").style.display = done ? "block" : "none";
  $("bar").style.width = (Math.min(i + 1, tasks.length) / tasks.length * 100) + "%";
  $("count").textContent = done ? "Усі завдання виконано!" : `Завдання ${i + 1} з ${tasks.length}`;
  $("backBtn").disabled = i === 0;
  $("nextBtn").style.visibility = done ? "hidden" : "visible";
  $("nextBtn").textContent = i === tasks.length - 1 ? "Завершити ✓" : "Далі →";

  if (done) {
    $("list").innerHTML = answers.map(a =>
      a.trim() ? `<li>${a.replace(/</g, "&lt;")}</li>` : `<li class="empty">— не написано —</li>`).join("");
    return;
  }
  $("answer").value = answers[i];
  $("feedback").textContent = "";
  $("feedback").className = "feedback";
  renderChips();
}

function check() {
  const text = $("answer").value.trim();
  const fb = $("feedback");
  if (!text) { fb.textContent = "Спочатку напиши речення 🙂"; fb.className = "feedback warn"; return false; }
  const used = usedWords(text);
  const missing = tasks[i].words.filter((_, k) => !used[k]).map(w => w[0]);
  const problems = [];
  if (missing.length) problems.push("Додай слова: " + missing.join(", "));
  if (text[0] !== text[0].toUpperCase()) problems.push("Почни речення з великої літери");
  if (!/[.!?…]$/.test(text)) problems.push("Постав крапку в кінці");
  if (problems.length) { fb.textContent = problems.join(". ") + "."; fb.className = "feedback warn"; return false; }
  return true;
}

$("answer").addEventListener("input", () => { answers[i] = $("answer").value; save(); renderChips(); });
$("nextBtn").onclick = () => { if (i < tasks.length && check()) { i++; render(); } };
$("backBtn").onclick = () => { if (i > 0) { i--; render(); } };
$("restartBtn").onclick = () => { answers = answers.map(() => ""); save(); i = 0; render(); };

render();
</script>
</body>
</html>
